name: KUBA Nearby Scanner v2.6.1 build

on:
  push:
    branches:
      - kuba-nearby-v260-build
    paths:
      - '.github/workflows/kuba-v261-build.yml'
      - 'ci/patch-v261.py'
      - 'kuba-v260-parts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat kuba-v260-parts/part*.b64 | base64 -d > /tmp/kuba-v260-source.zip
          unzip -q /tmp/kuba-v260-source.zip -d work
          python3 ci/patch-v261.py work
          grep -n 'versionCode\|versionName' work/app/build.gradle
          grep -n 'Flip7 FE' work/app/src/main/assets/device_name_signatures.tsv

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x work/ci-build.sh
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" work/ci-build.sh
          test -f work/dist/KUBA-Nearby-Scanner-v2.6.1.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs work/dist/KUBA-Nearby-Scanner-v2.6.1.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump badging work/dist/KUBA-Nearby-Scanner-v2.6.1.apk | head -20
          sha256sum work/dist/KUBA-Nearby-Scanner-v2.6.1.apk | tee work/dist/SHA256SUMS-v2.6.1.txt
          (cd work && zip -qr dist/KUBA-Nearby-Scanner-v2.6.1-source.zip app build.gradle settings.gradle gradle.properties ci-build.sh README.md CHANGELOG-v2.6.1.md tools)

      - name: Upload verified release
        uses: actions/upload-artifact@v4
        with:
          name: KUBA-Nearby-Scanner-v2.6.1-release
          if-no-files-found: error
          retention-days: 14
          path: |
            work/dist/KUBA-Nearby-Scanner-v2.6.1.apk
            work/dist/KUBA-Nearby-Scanner-v2.6.1-source.zip
            work/dist/SHA256SUMS-v2.6.1.txt
            work/dist/INSTALL-v2.6.1.txt
